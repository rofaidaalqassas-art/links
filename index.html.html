<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rofaida Alqassas — Data Analyst</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a0a0a;--card:#141210;--text:#f3ead6;--muted:#a89c80;--gold:#d4af37;--gold-light:#f1d98a;--gold-dark:#9a7b1f;--border:#3a3220;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1c1709 0%,#0a0a0a 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:48px 22px}
main{width:100%;max-width:420px;text-align:center}
.monogram{width:92px;height:92px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;font-size:40px;font-weight:700;color:var(--gold);background:#0a0a0a;border:2px solid var(--gold);box-shadow:0 0 0 6px #0a0a0a,0 0 0 7px var(--gold-dark),0 0 30px rgba(212,175,55,.25)}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:30px;letter-spacing:.5px;margin:0 0 10px;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light),var(--gold-dark));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:0}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto 30px}
a.btn{display:block;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:17px 18px;margin-bottom:14px;text-decoration:none;font-weight:600;font-size:16px;letter-spacing:.3px;transition:border-color .2s,box-shadow .2s,transform .2s}
a.btn:hover,a.btn:active{border-color:var(--gold);box-shadow:0 0 22px rgba(212,175,55,.18);transform:translateY(-1px)}
a.btn.primary{background:linear-gradient(135deg,var(--gold-dark),var(--gold) 50%,var(--gold-light));color:#14100a;border-color:var(--gold)}
small{display:block;font-weight:400;opacity:.7;margin-top:4px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<main>
<div class="monogram">R</div>
<h1>Rofaida Alqassas</h1>
<p class="role">Data Analyst · Business &amp; Marketing Analytics</p>
<div class="divider"></div>
<a class="btn primary" href="https://www.linkedin.com/in/rofaida-alqassas" target="_blank" rel="noopener">LinkedIn<small>Connect with me</small></a>
<a class="btn" href="https://drive.google.com/file/d/1R3OSLqugiVfG9VQslob9JdP4A5ERTCho/view?usp=drivesdk" target="_blank" rel="noopener">Curriculum Vitae<small>View / Download PDF</small></a>
<a class="btn" href="https://drive.google.com/file/d/1XytifPa1PMpMOgJwc-4RX6V6KEVHbY4V/view?usp=drivesdk" target="_blank" rel="noopener">Graduation Project<small>Infographic</small></a>
</main>
</body>
</html>
